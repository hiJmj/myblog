baseURL = 'https://example.org/'
locale = 'en-us'
title = 'My New Hugo Project'
theme = "hugo-PaperMod-master"

# 全局基础设定
[params]
defaultTheme = "auto"
ShowBreadCrumbs = true
ShowScrollToTop = true
ShowReadingTime = false
ShowWordCount = false
ShowCodeCopyButtons = true
author = ""
copyright = "© 2026 沉思札记 · 止于思辨与体察"

# 文章侧边目录
[params.toc]
enable = true
open = false

# 侧边栏（偏简约沉静，适配哲学氛围）
[params.sidebar]
open = true
[params.sidebar.profile]
enabled = true
avatar = "a.jpg"
name = "沉思者"
bio = "本体论思辨 | 存在体察 | 古典神秘体悟 | 纯粹观念求索"

# 首页导语
[params.homeInfoParams]
Title = "沉思之所"
Content = "记录存在辨析、观念论思索、古典神秘体悟；不追结论，重在体察与自省。"

# 站内搜索
[outputFormats]
[outputFormats.search]
baseName = "search"
isPlainText = false
mediaType = "application/json"

# 顶部导航栏
[menu]
[[menu.main]]
name = "首页"
url = "/"
weight = 1
[[menu.main]]
name = "编年归档"
url = "/archives/"
weight = 2
[[menu.main]]
name = "议题标签"
url = "/tags/"
weight = 3
[[menu.main]]
name = "检索"
url = "/search/"
weight = 4

# 中文规范，消除警告
[languages.zh-cn]
languageName = "简体中文"
weight = 1
locale = "zh-cn"
direction = "ltr"